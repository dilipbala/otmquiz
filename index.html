<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripJack Expert Challenge | OTM 2026</title>
    <style>
        :root { --tj-blue: #00529b; --tj-orange: #f37021; --correct: #27ae60; --incorrect: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        #main-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); width: 90%; max-width: 450px; text-align: center; border-top: 10px solid var(--tj-blue); position: relative; min-height: 550px; display: flex; flex-direction: column; justify-content: center; }
        
        .logo { font-weight: bold; color: var(--tj-blue); font-size: 32px; margin-bottom: 10px; }
        .logo span { color: var(--tj-orange); }
        
        /* PANIC TIMER */
        #timer { font-size: 80px; font-weight: 900; color: #333; line-height: 1; margin-bottom: 10px; }
        .timer-low { color: var(--incorrect) !important; animation: panic 0.4s infinite; }
        @keyframes panic { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        input, select { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--tj-blue); }

        /* OPTIONS STYLING */
        .option { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 12px; cursor: pointer; transition: 0.2s; background: #fff; font-size: 17px; font-weight: 500; text-align: center; }
        .option.correct-glow { background: var(--correct) !important; color: white; border-color: var(--correct); }
        .option.incorrect-glow { background: var(--incorrect) !important; color: white; border-color: var(--incorrect); }
        .option:disabled { cursor: default; }

        #feedback-text { font-weight: bold; margin: 10px 0; min-height: 24px; font-size: 18px; }
        .hidden { display: none !important; }
        
        .tj-btn { background: var(--tj-orange); color: white; border: none; padding: 18px 30px; border-radius: 35px; font-weight: bold; cursor: pointer; font-size: 18px; width: 100%; margin-top: 10px; box-shadow: 0 5px 15px rgba(243, 112, 33, 0.3); text-transform: uppercase; }
        .tj-btn:disabled { background: #ccc; box-shadow: none; }

        #countdown-number { font-size: 120px; font-weight: 900; color: var(--tj-blue); }
        #question-text { font-size: 20px; color: #2c3e50; margin-bottom: 20px; font-weight: 600; line-height: 1.4; }
    </style>
</head>
<body>

<div id="main-card">
    <div class="logo">Trip<span>Jack</span></div>

    <div id="lead-screen">
        <h2>Expert Challenge</h2>
        <p>Prove your knowledge & win big!</p>
        <input type="text" id="agentName" placeholder="Full Name">
        <input type="email" id="agentEmail" placeholder="Email ID">
        <input type="text" id="agencyId" placeholder="Agency ID">
        <button class="tj-btn" id="start-btn" onclick="runCountdown()" disabled>Loading...</button>
    </div>

    <div id="countdown-screen" class="hidden">
        <div id="countdown-number">3</div>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="timer">60</div>
        <div id="question-text"></div>
        <div id="options-container"></div>
        <div id="feedback-text"></div>
        <button id="next-btn" class="tj-btn hidden" onclick="loadQuestion()">NEXT QUESTION</button>
    </div>

    <div id="spin-screen" class="hidden">
        <h2 style="color: var(--correct);">Quiz Complete!</h2>
        <p>Your Score: <span id="final-score" style="font-weight:bold; font-size: 24px;"></span>/5</p>
        <div style="background: #f0f7ff; padding: 20px; border-radius: 15px; margin: 20px 0; border: 1px solid #d0e7ff;">
            <p style="color: var(--tj-blue); font-weight: bold; margin:0;">GO TO THE WHEEL NOW!</p>
            <p style="font-size: 14px; color: #555;">Once you spin, enter your prize below:</p>
            <select id="spinPrize">
                <option value="">-- Select Your Prize --</option>
                <option value="100">100</option>
                <option value="200">200</option>
                <option value="300">300</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
                <option value="2000">2000</option>
                <option value="Better Luck Next Time">Better Luck Next Time</option>
            </select>
        </div>
        <button class="tj-btn" id="claim-btn" onclick="submitSpin()">CLAIM REWARD</button>
    </div>

    <div id="thanks-screen" class="hidden">
        <h2 style="color: var(--tj-blue);">Thank You!</h2>
        <p>Your reward has been logged in the system.</p>
        <div style="font-size: 80px; margin: 20px 0;">🎉</div>
        <button class="tj-btn" onclick="window.location.reload()">NEXT AGENT</button>
    </div>
</div>

<script>
    // Replace with your actual deployed Google Web App URL
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLoMA6vMbfdFT4OM6hHyCJORbm9-Vw7-k7iPNT3_BsaN-bjkK1yqNdp0JQGIqUvUdW/exec';
    
    let quizData = [], currentQ = 0, score = 0, timeLeft = 60, timerInterval, entryId = "";
    let agentName, agentEmail, agencyId;

    // Fetch Questions from Google Sheet (doGet)
    async function fetchQuestions() {
        try {
            const response = await fetch(SCRIPT_URL);
            quizData = await response.json();
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').innerText = "START QUIZ";
        } catch (e) { 
            console.error(e);
            alert("Connection error. Please refresh the page."); 
        }
    }
    fetchQuestions();

    function runCountdown() {
        agentName = document.getElementById('agentName').value.trim();
        agentEmail = document.getElementById('agentEmail').value.trim();
        agencyId = document.getElementById('agencyId').value.trim();

        if(!agentName || !agentEmail || !agencyId) { 
            alert("Please fill in all fields (Name, Email, and Agency ID) to start!"); 
            return; 
        }

        document.getElementById('lead-screen').classList.add('hidden');
        document.getElementById('countdown-screen').classList.remove('hidden');
        
        let count = 3;
        const countInt = setInterval(() => {
            count--;
            if (count > 0) document.getElementById('countdown-number').innerText = count;
            else if (count === 0) document.getElementById('countdown-number').innerText = "GO!";
            else { 
                clearInterval(countInt); 
                startQuiz(); 
            }
        }, 1000);
    }

    function startQuiz() {
        document.getElementById('countdown-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if(timeLeft <= 10) document.getElementById('timer').classList.add('timer-low');
            if(timeLeft <= 0) endQuiz();
        }, 1000);
    }

    function loadQuestion() {
        if (currentQ >= quizData.length) return endQuiz();
        
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('feedback-text').innerText = "";
        
        const data = quizData[currentQ];
        document.getElementById('question-text').innerText = data.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        data.a.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i, data.correct, data.correctText, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct, correctText, btn) {
        const allBtns = document.querySelectorAll('.option');
        allBtns.forEach(b => b.disabled = true);
        
        if(selected === correct) {
            score++;
            btn.classList.add('correct-glow');
            document.getElementById('feedback-text').innerText = "✅ Correct!";
            document.getElementById('feedback-text').style.color = "var(--correct)";
        } else {
            btn.classList.add('incorrect-glow');
            allBtns[correct].classList.add('correct-glow');
            document.getElementById('feedback-text').innerText = "❌ Oops! The right answer was: " + correctText;
            document.getElementById('feedback-text').style.color = "var(--incorrect)";
        }
        
        currentQ++;
        document.getElementById('next-btn').classList.remove('hidden');
    }

    async function endQuiz() {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('spin-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;

        // Stage 1: Post initial lead and score
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: "saveScore", 
                    name: agentName, 
                    email: agentEmail, 
                    agencyId: agencyId, 
                    score: score 
                })
            });
            const result = await response.json();
            entryId = result.entryId; 
        } catch (e) {
            console.error("Save error:", e);
        }
    }

    async function submitSpin() {
        const prize = document.getElementById('spinPrize').value;
        if(!prize) { 
            alert("Please select the prize won from the wheel!"); 
            return; 
        }

        document.getElementById('claim-btn').disabled = true;
        document.getElementById('claim-btn').innerText = "SAVING REWARD...";

        // Stage 2: Update row with spin result
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: "updateSpin", 
                    entryId: entryId, 
                    prize: prize 
                })
            });
            document.getElementById('spin-screen').classList.add('hidden');
            document.getElementById('thanks-screen').classList.remove('hidden');
        } catch (e) {
            alert("Error saving spin. Please check connection.");
            document.getElementById('claim-btn').disabled = false;
            document.getElementById('claim-btn').innerText = "CLAIM REWARD";
        }
    }
</script>
</body>
</html>
